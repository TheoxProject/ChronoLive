<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ChronoLive - Modifier la course
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;
            color: #111827;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 30px;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 28px;

            text-align: center;

            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 11px 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;

            background: white;
            color: #111827;
        }

        .course-type {
            width: 100%;

            padding: 11px 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            background: #f3f4f6;

            color: #374151;

            font-size: 14px;
        }

        .warning {
            display: none;

            margin:
                20px 0;

            padding: 14px;

            border-radius: 8px;

            background: #fff7ed;

            border:
                1px solid #fed7aa;

            color: #9a3412;

            font-size: 13px;

            line-height: 1.5;
        }

        .actions {
            margin-top: 28px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        button,
        .button {
            width: 100%;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }

        button {
            border:
                1px solid #111827;

            background: #111827;
            color: white;
        }

        .button {
            border:
                1px solid #d1d5db;

            background: white;
            color: #111827;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            Modifier la course
        </h1>


        <form
            method="POST"
            action="{{ url_for(
                'enregistrer_modification_course',
                nom_fichier=course.fichier.name
            ) }}"
        >

            <!-- ------------------------------------------------
                 NOM
            ------------------------------------------------- -->

            <div class="form-group">

                <label for="nom">
                    Nom
                </label>

                <input
                    id="nom"
                    name="nom"
                    type="text"
                    value="{{ course.nom }}"
                    required
                >

            </div>


            <!-- ------------------------------------------------
                 DATE
            ------------------------------------------------- -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    id="date"
                    name="date"
                    type="date"
                    value="{{ course.date.isoformat() }}"
                    required
                >

            </div>


            <!-- ------------------------------------------------
                 LIEU
            ------------------------------------------------- -->

            <div class="form-group">

                <label for="lieu">
                    Lieu
                </label>

                <input
                    id="lieu"
                    name="lieu"
                    type="text"
                    value="{{ course.lieu or '' }}"
                >

            </div>


            <!-- ------------------------------------------------
                 TYPE
                 Le type est défini à la création et ne peut
                 plus être modifié.
            ------------------------------------------------- -->

            <div class="form-group">

                <label for="type_course">
                    Type
                </label>

                <div
                    id="type_course"
                    class="course-type"
                >
                    {{ course.type_course }}
                </div>

            </div>


            <!-- ------------------------------------------------
                 HEURE DE DEPART
            ------------------------------------------------- -->

            <div class="form-group">

                <label for="heure_depart">
                    Heure de départ
                </label>

                <input
                    id="heure_depart"
                    name="heure_depart"
                    type="time"
                    value="{% if course.heure_depart %}{{ course.heure_depart.strftime('%H:%M') }}{% endif %}"
                >

            </div>


            <!-- ------------------------------------------------
                 AVERTISSEMENT DEPART COMMUN
            ------------------------------------------------- -->

            {% if course.type_course == "Grimpée"
               or course.type_course == "Critérium" %}

                <div
                    class="warning"
                    style="display: block;"
                >

                    ⚠ Cette course possède un départ commun.

                    <br>

                    La modification de l'heure de départ
                    sera appliquée à tous les coureurs.

                </div>

            {% endif %}


            <!-- ------------------------------------------------
                 ACTIONS
            ------------------------------------------------- -->

            <div class="actions">

                <button type="submit">
                    Enregistrer
                </button>

                <a
                    href="{{ url_for('accueil') }}"
                    class="button"
                >
                    Retour
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
